# Rebuilds the citations list from OpenAlex and deploys the pkgdown site to
# gh-pages, daily and on demand (Actions tab > pkgdown > Run workflow).
# The site is always built from develop.
#
# GitHub only fires scheduled runs from the copy of this file on the default
# branch (master), so the file must be on master as well as develop.
#
# Derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  schedule:
    - cron: "0 5 * * *" # daily, 05:00 UTC
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Never let a slow run overlap the next one
    concurrency:
      group: pkgdown
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The vignettes are pkgdown-only articles, so the packages they use are not
      # in DESCRIPTION and are listed here instead
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            any::jsonlite
            any::curl
            any::xfun
            any::DiagrammeR
            local::.
          needs: website

      # Fails the run, and so skips the deploy, if OpenAlex cannot be reached
      - name: Rebuild citations list from OpenAlex
        run: source("pkgdown/update_citations_bib.R")
        shell: Rscript {0}

      # The archive articles need packages no longer on CRAN, and LoLinR is very
      # slow. Drop them from this run's copy only: their pages already on gh-pages
      # stay live, as the deploy below does not delete files.
      - name: Skip archive articles
        run: rm -rf vignettes/archive

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
