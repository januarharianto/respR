# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    continue-on-error: ${{ matrix.config.allow-failure == true }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: macos-latest,   r: 'devel', allow-failure: true}
          - {os: macos-latest,   r: 'oldrel-1'}
          - {os: macos-latest,   r: '4.3.3'}
          - {os: macos-latest,   r: '4.4.3'}
          - {os: macos-latest,   r: '4.5.2'}
          - {os: macos-latest,   r: '4.6.1'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'devel', allow-failure: true}
          - {os: windows-latest, r: 'oldrel-1'}
          - {os: windows-latest, r: '4.3.3'}
          - {os: windows-latest, r: '4.4.3'}
          - {os: windows-latest, r: '4.5.2'}
          - {os: windows-latest, r: '4.6.1'}
          # Windows arm64. No CRAN binaries exist for this platform, so
          # dependencies come from R-universe (see repository config step).
          # Only R >= 4.6 has R-universe aarch64 binaries, hence no older rows.
          - {os: windows-11-arm, r: 'release', allow-failure: true}
          - {os: windows-11-arm, r: 'devel', allow-failure: true}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release', allow-failure: true}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: '4.6.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      CI: true
      _R_CHECK_ARGS_: '--no-tests --no-manual'
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_TESTS_: false
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_REMOTES_UPGRADE: never
      INSTALL_OPTS: "--no-build-vignettes --no-manual --as-cran --no-multiarch"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # P3M has no Windows arm64 binaries; setup-r defaults this off there
          use-public-rspm: ${{ matrix.config.os != 'windows-11-arm' }}

      # Configure R package repository for macOS/Windows
      - name: Configure R package repository for macOS/Windows
        if: runner.os != 'Linux'
        run: |
          # CRAN has no Windows arm64 binaries, so use R-universe there, which
          # serves them under bin/windows/aarch64/. R resolves that path itself.
          arm <- Sys.getenv("RUNNER_OS") == "Windows" && Sys.getenv("RUNNER_ARCH") == "ARM64"
          repo <- if (arm) "https://cran.r-universe.dev" else "https://cloud.r-project.org"

          # Set binary package type
          options(repos = c(CRAN = repo))
          options(pkgType = "binary")

          # Create a .Rprofile to force binary packages
          # On arm64 the repo must persist to later steps too, as nothing else sets it
          if (arm) cat(sprintf('options(repos = c(CRAN = "%s"))\n', repo), file = "~/.Rprofile", append = TRUE)
          cat('options(pkgType="binary")\n', file = "~/.Rprofile", append = TRUE)
          cat('options(install.packages.compile.from.source="never")\n', file = "~/.Rprofile", append = TRUE)
          cat('Sys.setenv(PKG_TYPE="binary")\n', file = "~/.Rprofile", append = TRUE)
          cat('Sys.setenv(PKGTYPE="binary")\n', file = "~/.Rprofile", append = TRUE)
        shell: Rscript {0}

      # Configure repositories for Linux
      - name: Configure R package repository for Linux
        if: runner.os == 'Linux'
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
        shell: Rscript {0}

      # Special handling for data.table on macOS devel
      - name: Special handling for data.table on macOS devel
        if: runner.os == 'macOS' && matrix.config.r == 'devel'
        run: |
          # Try to install data.table binary from mac.r-project.org for R-devel
          # If that fails, fall back to installing from source
          Rscript -e 'tryCatch(install.packages("data.table", type = "binary", repos = "https://mac.r-project.org"), error = function(e) { message("Binary install failed, installing from source..."); install.packages("data.table", type = "source", repos = "https://cloud.r-project.org") })'
        shell: bash

      # Pre-install data.table as binary for non-devel macOS and Windows
      - name: Pre-install data.table binary
        if: (runner.os == 'Windows' || (runner.os == 'macOS' && matrix.config.r != 'devel'))
        run: |
          arm <- Sys.getenv("RUNNER_OS") == "Windows" && Sys.getenv("RUNNER_ARCH") == "ARM64"
          repo <- if (arm) "https://cran.r-universe.dev" else "https://cloud.r-project.org"
          install.packages("data.table", type = "binary", repos = repo)
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf","--no-tests")'
          args: 'c("--no-manual","--no-tests")'
